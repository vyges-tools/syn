[package]
name = "vyges-syn"
version = "0.1.45"
edition = "2021"
description = "Integrated logic synthesis from RTL to a mapped netlist, on the shared AIG core."
license = "Apache-2.0"
authors = ["Vyges <https://vyges.com/contact>"]
homepage = "https://vyges.com"
repository = "https://github.com/vyges-tools/syn"
build = "build.rs"

[dependencies]
serde_json = "1"
# The causal trail. ⚠️ `default-features = false` as in the other engines: the trail is
# structured output on stderr, not a logging framework this engine gets to choose.
vyges-events = { git = "https://github.com/vyges-tools/events", branch = "main", default-features = false }

# slang + the sv-elab frontend, pinned and statically linked (Bazel), behind a backend callback.
vyges-slang-lib = { git = "https://github.com/vyges-tools/slang-lib", branch = "main" }

# Liberty: the library cells a design instantiates.
vyges-loom = { git = "https://github.com/vyges-tools/loom.git", branch = "main" }

[[bin]]
name = "vyges-syn"
path = "src/main.rs"

[lib]
name = "vyges_syn"
path = "src/lib.rs"

[patch."https://github.com/vyges-tools/slang-lib"]
vyges-slang-lib = { path = "../vyges-tools-slang-lib" }

[patch."https://github.com/vyges-tools/loom.git"]
vyges-loom = { path = "../vyges-tools-loom" }
