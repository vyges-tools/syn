[package]
name = "vyges-syn"
version = "0.1.56"
edition = "2021"
description = "Integrated logic synthesis from RTL to a mapped netlist, on the shared AIG core."
license = "Apache-2.0"
authors = ["Vyges <https://vyges.com/contact>"]
homepage = "https://vyges.com"
repository = "https://github.com/vyges-tools/syn"
build = "build.rs"

[features]
default = ["mimalloc"]
# The command-line entry built into the library too (`cli_main`), for the suite binaries
# that link every engine and run the one they are invoked as.
suite = []

# The binary's allocator (see [dependencies]). On by default for the binary; the suite, the only
# library consumer, links it too.
mimalloc = ["dep:mimalloc", "dep:libmimalloc-sys"]

[dependencies]
# `unbounded_depth`: slang's design JSON nests deeper than the default limit on real designs
# (long expression chains); `elab::procedures` parses it on a thread with a large stack.
serde_json = { version = "1", features = ["unbounded_depth"] }
# The causal trail. ⚠️ `default-features = false` as in the other engines: the trail is
# structured output on stderr, not a logging framework this engine gets to choose.
vyges-events = { git = "https://github.com/vyges-tools/events", branch = "main", default-features = false }

# slang + the sv-elab frontend, pinned and statically linked (Bazel), behind a backend callback.
vyges-slang-lib = { git = "https://github.com/vyges-tools/slang-lib", branch = "main" }

# ABC, in process: the AIG round trips.
vyges-abc-lib = { git = "https://github.com/vyges-tools/abc-lib", branch = "main" }

# Liberty: the library cells a design instantiates.
vyges-loom = { git = "https://github.com/vyges-tools/loom.git", branch = "main" }

# Liberty timing arcs and gate tables: the resynthesis delay estimates.
vyges-sta = { git = "https://github.com/vyges-tools/sta.git", branch = "main" }

# The design database the mapped netlist is exported into, and its Verilog writer.
vyges-opendb = { git = "https://github.com/vyges-tools/opendb.git", branch = "main" }

# The timer `acd_resynth` asks, as `restructure` builds it: the netlist over the database (grt),
# the libraries, constraints and buffer target slews (rsz), the logic constants (est).
vyges-rsz = { git = "https://github.com/vyges-tools/rsz.git", branch = "main", features = ["cli"] }
vyges-grt = { git = "https://github.com/vyges-tools/grt.git", branch = "main", default-features = false, features = ["odb"] }
vyges-est = { git = "https://github.com/vyges-tools/est.git", branch = "main", features = ["odb"] }

# The binary's global allocator. The reference build links tcmalloc for all of its code
# (BUILD.bazel `malloc = @tcmalloc`), not the system allocator; mimalloc measured fastest and
# smallest of tcmalloc / jemalloc / mimalloc on a like-for-like trial. Pinned exactly:
# libmimalloc-sys 0.1.44 bundles mimalloc v2 by default (0.1.45 on default to v3).
mimalloc = { version = "=0.1.48", default-features = false, optional = true }
libmimalloc-sys = { version = "=0.1.44", default-features = false, optional = true }

# On Linux the allocator also REPLACES malloc/free process-wide (`override`), so C++ code linked
# into the binary allocates through it too, as the reference's statically linked tcmalloc does for
# all of its code. Not on macOS, where the system zone allocator is left alone.
[target.'cfg(target_os = "linux")'.dependencies]
libmimalloc-sys = { version = "=0.1.44", default-features = false, features = ["override"], optional = true }

[[bin]]
name = "vyges-syn"
path = "src/main.rs"

[lib]
name = "vyges_syn"
path = "src/lib.rs"

[patch."https://github.com/vyges-tools/slang-lib"]
vyges-slang-lib = { path = "../vyges-tools-slang-lib" }

[patch."https://github.com/vyges-tools/loom.git"]
vyges-loom = { path = "../vyges-tools-loom" }

[patch."https://github.com/vyges-tools/abc-lib"]
vyges-abc-lib = { path = "../vyges-tools-abc-lib" }

[patch."https://github.com/vyges-tools/sta.git"]
vyges-sta = { path = "../vyges-tools-sta" }

[patch."https://github.com/vyges-tools/opendb.git"]
vyges-opendb = { path = "../vyges-tools-opendb" }

[patch."https://github.com/vyges-tools/opendb-lib.git"]
vyges-opendb-lib = { path = "../vyges-tools-opendb-lib" }

[patch."https://github.com/vyges-tools/rsz.git"]
vyges-rsz = { path = "../vyges-tools-rsz" }

[patch."https://github.com/vyges-tools/grt.git"]
vyges-grt = { path = "../vyges-tools-grt" }

[patch."https://github.com/vyges-tools/est.git"]
vyges-est = { path = "../vyges-tools-est" }

[patch."https://github.com/vyges-tools/stt.git"]
vyges-stt = { path = "../vyges-tools-stt" }

[patch."https://github.com/vyges-tools/dpl.git"]
vyges-dpl = { path = "../vyges-tools-dpl" }

# The reference is built -O3 with link-time optimisation (Bazel --config=release). LTO and one
# codegen unit let calls inline across crates; by language rule neither changes a result.
[profile.release]
lto = "fat"
codegen-units = 1
