# Build & test on every push to main and on pull requests (plus manual dispatch).
#
# 🔴 PUSH-TRIGGERED ON PURPOSE. Our release tooling derives the set of gating workflows from each
# repo's own `on:` triggers and requires every one green at HEAD, so a repo with no push-triggered
# workflow is reported as "not gated" — which reads like a pass and is actually "nobody looked".
#
# The engine reads and writes the design database through vyges-opendb, which statically links
# libodb (C++, built from source), and links the prebuilt archives of ABC and the SystemVerilog frontend. Hence the
# sibling layout below, a C toolchain, and the bundles fetched for the siblings checked out.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vyges-tools-syn
    steps:
      - uses: actions/checkout@v7
        with:
          path: vyges-tools-syn
      # Every [patch] path in Cargo.toml must resolve: a missing one is a hard `failed to load
      # source`, not a fall-back to the git source.
      - name: Sibling checkouts
        working-directory: .
        run: |
          set -eu
          ref=main
          for r in slang-lib loom abc-lib opendb opendb-lib; do
            git clone -q --depth 1 --branch "$ref" "https://github.com/vyges-tools/$r" "vyges-tools-$r"
            echo "vyges-tools-$r @ $ref $(git -C vyges-tools-$r rev-parse --short HEAD)"
          done

      - name: Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ git bison libboost-dev libboost-iostreams-dev libbz2-dev zlib1g-dev

      - name: Prebuilt archives
        run: |
          bash ../vyges-tools-abc-lib/scripts/fetch-bundle.sh "$RUNNER_TEMP/abc" >> "$GITHUB_ENV"
          bash ../vyges-tools-slang-lib/scripts/fetch-bundle.sh "$RUNNER_TEMP/slang" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # No --locked: the [patch] resolves the sibling crates to the checkouts @ main, which the
      # committed lock file cannot know — let Cargo resolve.
      - name: Build
        run: cargo build --release --verbose
      - name: Test
        run: cargo test --release --verbose
      - name: Clippy
        run: cargo clippy --release --all-targets -- -D warnings
      - name: Smoke the contract
        run: |
          ./target/release/vyges-syn --version
          ./target/release/vyges-syn --describe | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["name"]=="syn", d'
          # A command not built yet is REFUSED with exit 3, never a silent 0.
          set +e; ./target/release/vyges-syn run x; rc=$?; set -e
          test "$rc" = 3
